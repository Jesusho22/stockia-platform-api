name: Deploy to Azure App Service

# Publishes the API to Azure App Service on every push to main (or by hand).
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   - secret   AZURE_WEBAPP_PUBLISH_PROFILE  (App Service > Overview > Download publish profile)
#   - variable AZURE_WEBAPP_NAME             (App Service name, e.g. stockia-platform-api)
# Database, JWT secret and CORS origins are App Service environment variables
# (STOCKIA_DB_*, STOCKIA_JWT_SECRET, STOCKIA_CORS_ORIGINS); they never go in the repo.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "ml/data/**", "tests/e2e/**"]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/swagger
    steps:
      - name: Check Azure settings
        id: settings
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ] || [ -z "$APP_NAME" ]; then
            echo "::warning title=Azure deploy skipped::Add the AZURE_WEBAPP_PUBLISH_PROFILE secret and the AZURE_WEBAPP_NAME variable to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.settings.outputs.ready == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Unit tests
        if: steps.settings.outputs.ready == 'true'
        run: dotnet test DataBit.StockIA.Platform.sln -c Release

      - name: Publish
        if: steps.settings.outputs.ready == 'true'
        run: dotnet publish DataBit.StockIA.Platform/DataBit.StockIA.Platform.csproj -c Release -o publish

      - name: Deploy to Azure
        if: steps.settings.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Health check
        if: steps.settings.outputs.ready == 'true'
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/v1/health"
          for i in $(seq 1 30); do
            if body=$(curl -fsS --max-time 20 "$url"); then
              echo "::notice title=StockIA API on Azure::$body"
              exit 0
            fi
            echo "Waiting for the API ($i/30)..."; sleep 10
          done
          echo "::error title=Health check failed::$url did not answer. Check App Service > Log stream (database variables and firewall)."
          exit 1
