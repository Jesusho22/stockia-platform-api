name: ML pipeline

on:
  push:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:
    inputs:
      weather:
        description: "Weather source for the training data"
        default: "open-meteo"
        type: choice
        options: [open-meteo, auto, climatology]

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (calendar, features, ONNX parity)
        run: python -m pytest -q
      - name: Retrain with real Open-Meteo weather (check only, the committed model is not replaced)
        run: python -m stockia_ml.train --weather ${{ inputs.weather || 'open-meteo' }} --out ${{ runner.temp }}/models
      - name: Metrics summary
        run: |
          echo '### Demand model trained in CI' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ${{ runner.temp }}/models/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;m=json.load(open('${{ runner.temp }}/models/metrics.json'));print('::notice title=Model WAPE::model', m['model']['wape'], '| baseline', m['baseline_same_weekday_mean_4w']['wape'], '| sources', json.load(open('${{ runner.temp }}/models/model_metadata.json'))['data_sources'])"
      - uses: actions/upload-artifact@v4
        with:
          name: demand-model
          path: ${{ runner.temp }}/models
