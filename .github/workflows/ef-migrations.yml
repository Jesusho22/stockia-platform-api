name: EF Core migration

# Creates an EF Core migration and commits it to the same branch.
# Usage: write the migration name (e.g. AddStockConsumptions) in
# .github/ef-migration-request and push. Locally the same is:
#   dotnet ef migrations add <Name> --project DataBit.StockIA.Platform \
#     --output-dir Shared/Infrastructure/Persistence/EFC/Migrations

on:
  push:
    paths: [".github/ef-migration-request"]

permissions:
  contents: write

jobs:
  add-migration:
    name: Add migration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Add the migration
        run: |
          name="$(head -n 1 .github/ef-migration-request | tr -cd 'A-Za-z0-9')"
          [ -n "$name" ] || { echo "::error::The request file is empty"; exit 1; }
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet restore DataBit.StockIA.Platform.sln
          dotnet build DataBit.StockIA.Platform/DataBit.StockIA.Platform.csproj --no-restore
          dotnet ef migrations add "$name" --project DataBit.StockIA.Platform --no-build \
            --output-dir Shared/Infrastructure/Persistence/EFC/Migrations
          git rm -q .github/ef-migration-request
          git add DataBit.StockIA.Platform/Shared/Infrastructure/Persistence/EFC/Migrations
          git -c user.name="Jesus" -c user.email="laplaceho@gmail.com" commit -q -m "feat(db): add ${name} EF Core migration" \
            -m "Generated by dotnet ef migrations add in GitHub Actions." \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Q3Dee5nfiUqvB1ErSHYtVC"
          git push
          echo "::notice title=Migration added::$name"
